<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WireGuard</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="hidden" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5l0 14"/><path d="M5 12l14 0"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/><path d="M7 11l5 5l5 -5"/><path d="M12 4l0 12"/></symbol>
    <symbol id="i-qrcode" viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"/><path d="M7 17l0 .01"/><path d="M14 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"/><path d="M7 7l0 .01"/><path d="M4 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"/><path d="M17 7l0 .01"/><path d="M14 14l3 0"/><path d="M20 14l0 .01"/><path d="M14 14l0 3"/><path d="M14 20l3 0"/><path d="M17 17l3 0"/><path d="M20 17l0 3"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/><path d="M9 12h12l-3 -3"/><path d="M18 15l3 -3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></symbol>
  </svg>
  <header>
    <h1>WireGuard</h1>
    <select id="inbound" aria-label="Инбаунд"></select>
    <button class="btn" id="refresh"><svg><use href="#i-refresh"/></svg>Обновить</button>
    <button class="btn" id="logout"><svg><use href="#i-logout"/></svg>Выйти</button>
  </header>
  <main>
    <section class="card">
      <div class="actions">
        <label for="user">Новый клиент для пользователя панели</label>
        <input id="user" placeholder="id или имя, например alice-phone" autocomplete="off">
        <button class="btn" id="add"><svg><use href="#i-plus"/></svg>Добавить клиента</button>
      </div>
      <p class="warn">Любое изменение перезапускает Xray на нодах профиля: соединения через ноды прервутся на пару секунд.</p>
      <p class="error" id="error"></p>
    </section>
    <section class="card">
      <table>
        <thead><tr><th>Пользователь</th><th>email</th><th>Адрес</th><th>Ключ</th><th></th></tr></thead>
        <tbody id="clients"></tbody>
      </table>
    </section>
  </main>
  <dialog id="confirm">
    <h3>Удалить клиента?</h3>
    <p id="confirm-text"></p>
    <p class="warn">Xray на нодах профиля перезапустится.</p>
    <div class="actions">
      <button class="btn" id="confirm-no">Отмена</button>
      <button class="btn danger" id="confirm-yes"><svg><use href="#i-trash"/></svg>Удалить</button>
    </div>
  </dialog>
  <dialog id="qr-dialog">
    <h3 id="qr-title"></h3>
    <img class="qr" id="qr-img" alt="QR-код конфигурации">
    <div class="actions">
      <button class="btn" id="qr-download"><svg><use href="#i-download"/></svg>Скачать .conf</button>
      <button class="btn" id="qr-close">Закрыть</button>
    </div>
  </dialog>
</body>
</html>
